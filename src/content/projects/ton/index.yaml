blocks:
  - type: text
    heading: The problem
    body: |-
      Music students find out whether a practice room is free by walking to it. In my survey of 12 current and recent music students, every one had found a room occupied when they expected it to be free, and 42% run into it often. Availability lives in people’s heads, so nobody can answer the one question that matters: *is it free right now?*

      TON is a booking app for the Faculty of Music at Transilvania University of Brașov, designed around that question.
  - type: text
    heading: What I learned
    body: |-
      - **Occupancy is discovered too late.** Every workaround I found was a present-tense check, made on foot.
      - **Booking is a habit, not an event.** The typical journey is a re-booking: same room, same weekday, same slot, squeezed between classes.
      - **Trust is borrowed from the institution.** A reservation only means something if the person holding it can be identified — and none of the three booking tools I compared (Skedda, Robin and TeamUp) handled that.
  - type: logo
    heading: The mark
    caption: The O doubles as a power symbol, crowned with a musical note.
