  - type: text
    heading: Three decisions
    body: |-
      1. **Room state first, calendar second.** Every room card says whether the room is available, reserved or temporarily closed; date and time move to the room’s own screen, where you have already chosen it.
      2. **Recommendations first, not search first.** Home opens on the rooms you are likely to want, and *Booking again* repeats a previous reservation in one step — built for the fifth booking, not the first.
      3. **University email only.** Signing in with an institutional address means a held room always has a name attached, which is what makes *Reserved* believable.

      The prototype has 18 screens in English and Romanian, light and dark — including the states that are easy to skip: temporarily closed rooms, cancelling a booking and signing out.
  - type: text
    heading: What the test showed
    body: In a first-contact test with no walkthrough, people booked a room in about two minutes — and several went on to cancel it without being asked, a sign the flow felt safe to explore. It was a small test, so I read it as a direction rather than a benchmark.
  - type: text
    heading: What I’d do differently
    body: A contrast audit showed that my most important signal was my least readable element — the green *Available* chip measured 1.89:1 against the 4.5:1 it needs. I specified re-toned status colours for both themes, and every status carries a word as well as a colour. Next time I would check contrast while choosing the palette, not after the prototype is finished.
