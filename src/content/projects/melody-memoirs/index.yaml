title: Melody Memoirs
summary: "A community for the stories behind the music that moved you: the logo and a working app prototype."
disciplines:
  - graphic-design
  - uiux
year: 2025
client: Concept project
challenge: Give people a place to write down the moments when music moved them, and to read other people’s.
outcome: A working app prototype built in Figma Make, with fifteen genres and every story in eight languages.
tools:
  - figma
cover:
  image: cover.webp
  alt: Melody Memoirs in a browser window, its welcome page in light mode, beside a phone showing the same page in dark mode
  panel: none
  fit: cover
accent: "#58433B"
featured: true
hidden: false
order: 2
blocks:
  - type: text
    heading: The idea
    body: "Melody Memoirs is a place to write down the moments when a piece of music moved you — in a concert hall or somewhere much quieter — and to read other people’s. The mark says it in a single shape: an open book whose pages hold a note."
  - type: logo
    heading: The mark
    variants:
      - image: logo.png
        alt: Melody Memoirs logo in its original colours
        label: Original colours
        panel: accent
      - image: logo-peach.png
        alt: Melody Memoirs logo redrawn in the peachless. palette
        label: In the peachless. palette
        panel: linen
  - type: text
    heading: The prototype
    body: |-
      The prototype is a working app built in Figma Make rather than a click-through. Anyone can read the stories; members write their own — up to 500 words, with photos and a genre — and appreciate and save other people’s.

      - **Fifteen genres**, from Baroque to the 21st century, give a way in when you don’t know what you’re looking for.
      - **Every story in eight languages**, translated on demand.
      - **Light and dark mode**, and a profile for your own stories and favourites.
  - type: gallery
    heading: The app
    frame: browser
    images:
      - image: screen-languages.webp
        alt: The welcome page with its language menu open, listing eight languages from English to Română
        caption: Eight languages
      - image: screen-genres.webp
        alt: The form for sharing a story, with its list of fifteen genres open, from Baroque to 21st Century
        caption: Fifteen genres
      - image: screen-dark.webp
        alt: The welcome page in dark mode
        caption: Dark mode
  - type: prototype
    url: https://www.figma.com/make/BQtydWnM0aJYReMTqpOiaB/Melody-Memoirs--Community-?node-id=0-1&p=f&t=18eWXd6TlkRVcn16-0&fullscreen=1
    label: Try the Melody Memoirs prototype
    poster: screen-welcome.webp
    frame: browser
