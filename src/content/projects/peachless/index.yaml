  image: lockup.png
  alt: "The peachless. logo: a stylised peach above the wordmark"
  panel: paper
  fit: contain
featured: true
hidden: false
order: 1
blocks:
  - type: text
    heading: The idea
    body: |-
      The **peachless.** logo is built around the stylised shape of a peach, symbolising naturalness, freshness and simplicity. The design is minimalist, modern and elegant, with clean lines and balanced geometric elements.

      At the core of the logo, the peach subtly incorporates the letters that form the word **peachless.**, turning the symbol into a unique and memorable brand identity — a clever integration that gives the logo both visual appeal and conceptual depth.
  - type: logo
    heading: The mark
    caption: The full logo combines the wordmark and symbol for a complete, balanced brand mark. The wordmark is set in a classic serif — the period adds a confident, modern touch.
    variants:
      - image: lockup.png
        alt: "Full logotype: the peach symbol above the peachless. wordmark"
        label: Full logotype
        panel: paper
      - image: symbol.svg
        alt: The peach symbol on its own
        label: Symbol
        panel: linen
  - type: text
    heading: Colour system
    body: The colour palette is a curated harmony of soft neutrals and bold contrast — warm peachy tones, cream and muted black that reflect a friendly yet refined tone. Rooted in minimalism, these colours are the foundation for every touchpoint of the brand.
  - type: palette
    swatches:
